name: Deploy .NET MVC to Somee

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Đóng gói ứng dụng
      - name: Publish project
        run: dotnet publish -c Release -o ./publish

      # 4. TẮT SERVER: Upload app_offline.htm vào đúng thư mục web
      - name: ⛔ Stop Server (Upload app_offline.htm)
        run: |
          echo "<html><body><h1>Website dang bao tri va nang cap...</h1></body></html>" > app_offline.htm
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -T app_offline.htm "ftp://${{ secrets.FTP_SERVER }}/www.lehoangnam.somee.com/app_offline.htm" || true
          echo "Dung 10 giay de IIS giai phong khoa file..."
          sleep 10
          
      # 5. DEPLOY CODE: Upload code thẳng vào thư mục www.lehoangnam.somee.com/
      - name: 🚀 Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: www.lehoangnam.somee.com/
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/app_offline.htm

      # 6. BẬT SERVER: Xóa file app_offline.htm
      - name: ▶️ Start Server (Delete app_offline.htm)
        if: always()
        run: |
          curl -s --ftp-pasv -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -Q "-DELE /www.lehoangnam.somee.com/app_offline.htm" || true